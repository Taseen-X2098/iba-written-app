<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Your plan is active</title></head>
  <body style="margin:0;padding:0;background:#f8fafc;color:#0f172a;font-family:Inter,Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f8fafc;padding:32px 16px;"><tr><td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;">
        <tr><td style="padding:0 0 20px;text-align:center;"><span style="display:inline-block;background:#16a34a;border-radius:10px;color:#fff;font-size:22px;font-weight:800;padding:11px 18px;">IBA Written</span></td></tr>
        <tr><td style="background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:36px 32px;">
          <h1 style="color:#0f172a;font-size:26px;line-height:1.25;margin:0 0 16px;">Your plan is active</h1>
          <p style="color:#334155;font-size:16px;line-height:1.65;margin:0 0 16px;">Hi {{params.first_name}},</p>
          <p style="color:#334155;font-size:16px;line-height:1.65;margin:0 0 16px;">Your <strong style="color:#15803d;">{{params.plan_name}}</strong> has been activated. {{params.plan_description}}.</p>
          <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;color:#166534;font-size:14px;line-height:1.5;margin:20px 0 0;padding:14px 16px;"><strong>Plan valid until:</strong> {{params.expires_at}}</div>
          <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:28px 0 4px;"><tr><td style="border-radius:8px;background:#16a34a;"><a href="{{params.subscription_url}}" style="display:inline-block;border-radius:8px;color:#fff;font-size:15px;font-weight:700;padding:13px 20px;text-decoration:none;">View my plan</a></td></tr></table>
        </td></tr>
      </table>
    </td></tr></table>
  </body>
</html>
